[project]
name = "promise-aware-eta"
version = "0.1.0"
description = "Promise-Aware ETA and delivery promise tuning research pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Yash Rathod" }
]
license = { file = "LICENSE" }
dependencies = [
  "pandas>=2.1",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "statsmodels>=0.14",
  "mlflow>=2.11",
  "matplotlib>=3.7",
  "plotly>=5.18"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
  "ipykernel>=6.25"
]

[project.urls]
Homepage = "https://github.com/Yash02102/PromiseAwareETA"
Repository = "https://github.com/Yash02102/PromiseAwareETA"
Issues = "https://github.com/Yash02102/PromiseAwareETA/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
