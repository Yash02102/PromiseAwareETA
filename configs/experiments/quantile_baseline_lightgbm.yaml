model:
  name: lightgbm_quantile
  quantiles: [0.1, 0.5, 0.9]
  params:
    objective: quantile
    boosting_type: gbdt
    num_leaves: 127
    max_depth: -1
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 100
    min_child_weight: 1e-3
    lambda_l1: 0.0
    lambda_l2: 0.0
    feature_fraction_bynode: 0.8
    verbosity: -1

data:
  features_path: data/processed/features.parquet
  target_column: delivery_lag_days
  features_columns_path: data/processed/features_columns.txt
  train_period:
    start: 2017-01-01
    end: 2017-12-31
  valid_period:
    start: 2018-01-01
    end: 2018-06-30

training:
  num_boost_round: 1200
  early_stopping_rounds: 100
  seed: 1729

logging:
  tracker: mlflow
  experiment: quantile_baseline_lightgbm

